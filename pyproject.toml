[project]
name = "denver311"
version = "0.1.0"
description = "Denver 311 service request analytics: demand, resolution time, channel, and geography, 2019-2025."
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jason Pellerin", email = "jason@jasonpellerin.com" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.5.6",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.1",
    "tableauhyperapi==0.0.26479",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denver311"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is owned by ruff format; long SQL and log strings stay whole
